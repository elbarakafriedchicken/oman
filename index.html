<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعم البركة - المنيو الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--main-red:#d32f2f;
--main-yellow:#ffc107;
--bg:#f8f9fa;
--text:#2d3436;
--card-bg:#ffffff;
}
[data-theme="dark"]{
--bg:#121212;
--text:#ffffff;
--card-bg:#1e1e1e;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);margin:0;padding-bottom:80px}
.header{background:var(--main-red);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}
.tabs{display:flex;overflow-x:auto;background:var(--card-bg);padding:10px;gap:8px;border-bottom:1px solid #ddd}
.tab{padding:8px 18px;border-radius:20px;border:1px solid var(--main-red);background:none;color:var(--main-red);font-weight:bold;cursor:pointer}
.tab.active{background:var(--main-red);color:#fff}
.item-card{display:flex;background:var(--card-bg);margin:12px;border-radius:15px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.1);cursor:pointer;height:110px}
.item-card img{width:110px;height:110px;object-fit:cover}
.item-info{padding:10px;flex:1;display:flex;flex-direction:column;justify-content:center}
.price-tag{color:var(--main-red);font-weight:bold;margin-top:5px}
.page-content{display:none;padding-bottom:120px}
.opt-box{background:var(--card-bg);margin:15px;padding:15px;border-radius:12px;border:1px solid #eee}
input,select,textarea{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ccc;font-family:'Cairo'}
.start-btn{background:var(--main-red);color:#fff;border:none;padding:12px;border-radius:30px;font-weight:bold;width:100%;cursor:pointer}
.footer{position:fixed;bottom:0;width:100%;background:var(--card-bg);border-top:2px solid var(--main-red)}
.nav-bar{display:flex;justify-content:space-around;padding:10px}
.cart-count{background:var(--main-yellow);padding:2px 7px;border-radius:50%;font-size:.8rem}
</style>
</head>
<body>

<div id="menu-page" class="page-content">
<div class="header">
<span>قائمة الطعام</span>
<button onclick="toggleTheme()">🌓</button>
</div>
<div class="tabs" id="cat-tabs"></div>
<div id="items-list"></div>
</div>

<div id="cart-page" class="page-content">
<div class="header">
<span>سلة الطلبات</span>
<button onclick="goToMenu()">رجوع</button>
</div>

<div class="opt-box">
<label>👤 اسم العميل:</label>
<input type="text" id="customer-name" placeholder="اكتب اسمك">
</div>

<div class="opt-box">
<label>📞 رقم العميل:</label>
<input type="tel" id="customer-phone" placeholder="مثال: 99876543">
</div>

<div class="opt-box">
<label>⏱️ وقت الاستلام:</label>
<select id="pickup-time">
<option value="خلال 20 دقيقة">خلال 20 دقيقة</option>
<option value="بعد 30 دقيقة">بعد 30 دقيقة</option>
<option value="بعد 45 دقيقة">بعد 45 دقيقة</option>
<option value="بعد ساعة">بعد ساعة</option>
</select>
</div>

<div id="cart-display"></div>

<div class="opt-box">
<h3>الإجمالي: <span id="total-val">0.000</span> ر.ع</h3>
<button class="start-btn" style="background:#25D366" onclick="submitOrder()">إرسال الطلب واتساب</button>
</div>
</div>

<div class="footer">
<div class="nav-bar">
<button onclick="goToMenu()">🍴 المنيو</button>
<button onclick="goToCart()">🛒 السلة <span class="cart-count" id="c-count">0</span></button>
</div>
</div>

<script>
const saucesUI=`
<option>صوص رانش</option>
<option>صوص باربيكو</option>
<option>صوص كوكتيل</option>
<option>صوص حار</option>
<option>صوص سويت شيلي</option>
<option>صوص ثوميه</option>
<option>حلقات هالبينو</option>
`;

const drinksUI=`
<option>السي كولا</option>
<option>السي تفاح</option>
<option>السي كولا دايت</option>
<option>السي ليمون</option>
<option>السي ستريم</option>
<option>السي برتقال</option>
<option>السي حمضيات</option>
`;

let menuData={
"بروست":[{name:"بروست 4 قطع",price:1.500}],
"استريبس":[{name:"استريبس 5 قطع",price:1.200}],
"سندوتشات":[{name:"توستر",price:1.000}],
"اتشيكن فرايز":[{name:"اتشيكن فرايز",price:1.300}],
"إضافات وجبات":[
{name:"باكيت شيبس",price:0.300},
{name:"مياه",price:0.100},
{name:"قطع استريبس",price:0.500},
{name:"مشروب غازي",price:0.200}
]
};

let cart=[];

function renderTabs(){
const tabs=document.getElementById("cat-tabs");
tabs.innerHTML="";
Object.keys(menuData).forEach((cat,i)=>{
tabs.innerHTML+=`<button class="tab ${i===0?'active':''}" onclick="showCategory('${cat}',this)">${cat}</button>`;
});
}

function showCategory(cat,btn){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(btn)btn.classList.add("active");
const list=document.getElementById("items-list");
list.innerHTML="";
menuData[cat].forEach(item=>{
list.innerHTML+=`
<div class="item-card" onclick='addToCart(${JSON.stringify(item)})'>
<img src="https://via.placeholder.com/110">
<div class="item-info">
<h3>${item.name}</h3>
<span class="price-tag">${item.price.toFixed(3)} ر.ع</span>
</div>
</div>`;
});
}

function addToCart(item){
cart.push({...item,qty:1});
document.getElementById("c-count").innerText=cart.length;
alert("تمت الإضافة للسلة");
}

function goToMenu(){
document.getElementById("menu-page").style.display="block";
document.getElementById("cart-page").style.display="none";
renderTabs();
showCategory(Object.keys(menuData)[0]);
}

function goToCart(){
document.getElementById("menu-page").style.display="none";
document.getElementById("cart-page").style.display="block";
renderCart();
}

function renderCart(){
let display=document.getElementById("cart-display");
display.innerHTML="";
let total=0;
cart.forEach(i=>{
total+=i.price*i.qty;
display.innerHTML+=`<div class="opt-box">${i.name} - ${i.price.toFixed(3)} ر.ع</div>`;
});
document.getElementById("total-val").innerText=total.toFixed(3);
}

function submitOrder(){
if(!cart.length)return alert("السلة فارغة");

const name=document.getElementById("customer-name").value.trim();
const phone=document.getElementById("customer-phone").value.trim();
const time=document.getElementById("pickup-time").value;

if(!name||!phone)return alert("اكتب الاسم والرقم");

localStorage.setItem("baraka_name",name);
localStorage.setItem("baraka_phone",phone);

let text=`طلب جديد - مطعم البركة 🍗\n`;
text+=`👤 الاسم: ${name}\n`;
text+=`📞 الرقم: ${phone}\n`;
text+=`⏱️ وقت الاستلام: ${time}\n\n`;

cart.forEach(i=>{
text+=`▪️ ${i.name} - ${i.price.toFixed(3)} ر.ع\n`;
});

text+=`\nالإجمالي: ${document.getElementById("total-val").innerText} ر.ع`;

window.open(`https://wa.me/96892018510?text=${encodeURIComponent(text)}`);
}

function toggleTheme(){
document.body.setAttribute("data-theme",
document.body.getAttribute("data-theme")==="dark"?"light":"dark");
}

window.onload=function(){
goToMenu();
document.getElementById("customer-name").value=localStorage.getItem("baraka_name")||"";
document.getElementById("customer-phone").value=localStorage.getItem("baraka_phone")||"";
};
</script>

</body>
</html>
